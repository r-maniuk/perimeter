# Perimeter message broker: one NATS server with JetStream.
#
# Clients reach it only on the internal `core` network. Every connection authenticates as one of
# three service users; passwords are bcrypt hashes generated on first start by the `secrets` job
# (python -m perimeter.tools.secrets) and included below. Nothing in this file is secret.

server_name: perimeter
listen: 0.0.0.0:4222
# Monitoring (/healthz, /varz, /jsz) stays inside the container: only the health check uses it.
http: 127.0.0.1:8222

# Limits sized for this workload: device reports are ~100 B, position frames at most tens of KB.
max_payload: 1MB
max_pending: 64MB
max_control_line: 4KB
max_connections: 1024
write_deadline: "10s"
ping_interval: "20s"
ping_max: 3

# An acknowledged publish is in the store and survives a crash of this process; the default fsync
# interval (2 min) bounds what a power loss of the host could still take.
jetstream {
  store_dir: /data
  # TELEMETRY reserves its max_bytes (2 GiB by default) out of this budget.
  max_file_store: 6GB
  # The live `sessions` bucket is the only in-memory stream.
  max_memory_store: 256MB
}

include ./auth/passwords.conf

# ---------------------------------------------------------------------------------------------
# Permission matrix
#
# Allow lists: anything not listed is refused. The client receives a "Permissions Violation"
# error and the server logs a "Publish Violation" or "Subscription Violation" line, so a clean run
# is one whose server log contains no "Violation" at all (`make audit-broker` checks the stack).
# Every service also has its own reply inbox, _INBOX.<user>.>, set by perimeter.bus.connection,
# so no service can read another one's replies. tests/integration/test_broker_permissions.py runs
# this file against a real server: each user's work passes, each forbidden action is refused.
#
#   subject                          init      api                  engine
#   tlm.<device>                     -         pub (ingest)         -
#   evt.<user>                       -         pub (zone events)    pub (alerts)
#   pos.<quadkey...>                 -         sub                  pub
#   live.evt.<user>                  -         sub (live.*.<user>)  -
#   live.occ.<user>                  -         sub (live.*.<user>)  pub
#   live.ses.<user>                  -         pub + sub            -
#   ctl.ses.<sid>                    -         pub + sub            -
#   sys.metrics.<service>.<id>       -         pub own, sub all     pub own
#   $KV.engine.>                     -         -                    pub (leases, CAS)
#   $KV.sessions.>, $KV.revoked.>    -         pub (registry)       -
#   $JS.API stream/consumer info     yes       yes                  yes
#   $JS.API create/update streams    yes       -                    -
#   $JS.API durable consumers        create    -                    fetch + ack
#   $JS.API ephemeral consumers      -         create (ordered)     create (KV watch)
#   $JS.API direct get               -         EVENTS, TELEMETRY    TELEMETRY
#   $JS.API delete / purge           -         -                    -
# ---------------------------------------------------------------------------------------------

# Nobody may destroy data through the API; repeated as an explicit deny so the rule survives any
# future widening of an allow list.
DESTRUCTIVE = [
  "$JS.API.STREAM.DELETE.>"
  "$JS.API.STREAM.PURGE.>"
  "$JS.API.STREAM.MSG.DELETE.>"
  "$JS.API.CONSUMER.DELETE.>"
]

# init: provisions streams, the per-partition durable consumers and the key-value buckets
# (perimeter.bus.topology.ensure); create and update only.
INIT = {
  publish = {
    allow = [
      "$JS.API.STREAM.INFO.*"               # idempotency and partition-count checks
      "$JS.API.STREAM.CREATE.*"             # TELEMETRY, EVENTS, KV_engine|sessions|revoked
      "$JS.API.STREAM.UPDATE.*"             # reconcile stream settings on every deploy
      "$JS.API.CONSUMER.INFO.TELEMETRY.*"   # does engine-p<n> exist
      "$JS.API.CONSUMER.CREATE.TELEMETRY.>" # engine-p<n>, filtered on tlm.<n>.*
    ]
    deny = $DESTRUCTIVE
  }
  subscribe = { allow = ["_INBOX.init.>"] }
}

# api: ingest, REST, live sessions. It reads the topology but can neither change nor delete it.
# It may only create unnamed (ephemeral) consumers and cannot pull from or delete a named one, so
# the engine's durable consumers are out of its reach: reads of history go through direct gets or
# ordered push consumers.
API = {
  publish = {
    allow = [
      "tlm.*"                               # device reports (JetStream publish, acked)
      "evt.*"                               # zone events from the outbox relay
      "live.ses.*"                          # a session joined or left
      "ctl.ses.*"                           # remote sign-out of one session
      "sys.metrics.api.*"                   # one-second heartbeat
      "$KV.sessions.>"                      # session registry (put, refresh, delete)
      "$KV.revoked.>"                       # revoked token ids
      "$JS.API.STREAM.INFO.*"               # topology check, bucket binding, EVENTS range
      "$JS.API.STREAM.NAMES"                # stream lookup for subscribe-by-subject
      "$JS.API.CONSUMER.INFO.*.*"           # topology check, watcher bookkeeping
      "$JS.API.CONSUMER.LIST.TELEMETRY"     # admission control samples consumer lag
      "$JS.API.CONSUMER.CREATE.EVENTS"      # ordered consumers: resume replay, gap healing
      "$JS.API.CONSUMER.CREATE.TELEMETRY"   # ordered consumer: device trail
      "$JS.API.CONSUMER.CREATE.KV_sessions" # registry watch
      "$JS.API.CONSUMER.CREATE.KV_revoked"  # revocation watch
      "$JS.API.STREAM.MSG.GET.EVENTS"
      "$JS.API.STREAM.MSG.GET.KV_sessions"
      "$JS.API.STREAM.MSG.GET.KV_revoked"
      "$JS.API.DIRECT.GET.EVENTS"           # stateless batched reads: resume, gap healing
      "$JS.API.DIRECT.GET.EVENTS.>"
      "$JS.API.DIRECT.GET.TELEMETRY"        # stateless batched reads: device trail
      "$JS.API.DIRECT.GET.KV_sessions.>"
      "$JS.API.DIRECT.GET.KV_revoked.>"
      "$JS.FC.EVENTS.>"                     # flow-control replies of ordered consumers
      "$JS.FC.TELEMETRY.>"
      "$JS.FC.KV_sessions.>"
      "$JS.FC.KV_revoked.>"
    ]
    deny = $DESTRUCTIVE
  }
  subscribe = {
    allow = [
      "_INBOX.api.>"
      "live.*.*"                            # live.{evt,occ,ses}.<user>: one subscription per user
      "ctl.ses.*"
      "pos.>"                               # position frames for viewed tiles
      "sys.metrics.>"                       # heartbeats of every process (ops view)
    ]
  }
}

# engine: pulls its partitions, holds leases, publishes alerts, positions and pulses.
ENGINE = {
  publish = {
    allow = [
      "evt.*"                               # alerts from the outbox relay
      "pos.>"                               # binary position frames per tile
      "live.occ.*"                          # occupancy pulses
      "sys.metrics.engine.*"                # one-second heartbeat
      "$KV.engine.>"                        # membership heartbeats, partition leases (CAS)
      "$JS.API.STREAM.INFO.*"               # topology check, bucket generation
      "$JS.API.CONSUMER.INFO.*.*"           # topology check, watcher bookkeeping
      "$JS.API.CONSUMER.MSG.NEXT.TELEMETRY.*"   # pull fetch from engine-p<n>
      "$JS.ACK.TELEMETRY.>"                 # ack, nak, term
      "$JS.API.DIRECT.GET.TELEMETRY"        # takeover: reread what a crashed owner left unacked
      "$JS.API.CONSUMER.CREATE.KV_engine"   # membership listing (ephemeral watch)
      "$JS.API.STREAM.MSG.GET.KV_engine"    # lease holder lookup
      "$JS.API.DIRECT.GET.KV_engine.>"
      "$JS.FC.KV_engine.>"
    ]
    deny = $DESTRUCTIVE
  }
  subscribe = { allow = ["_INBOX.engine.>"] }
}

authorization {
  timeout: 2
  users = [
    {user: init, password: $INIT_PASSWORD, permissions: $INIT, allowed_connection_types: ["STANDARD"]}
    {user: api, password: $API_PASSWORD, permissions: $API, allowed_connection_types: ["STANDARD"]}
    {user: engine, password: $ENGINE_PASSWORD, permissions: $ENGINE, allowed_connection_types: ["STANDARD"]}
  ]
}
