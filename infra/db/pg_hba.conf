# Client authentication: which role may reach which database, from where, and how.
# Loaded with `postgres -c hba_file=/etc/postgresql/pg_hba.conf` (see docker-compose.yml).
#
# TYPE  DATABASE    USER                       ADDRESS    METHOD

# The superuser is for maintenance from inside the container only:
#   docker compose exec db psql perimeter
local   all         postgres                              peer

# The services reach the application database over the internal network with SCRAM passwords:
# `perimeter` (schema owner, used by the init job) and `perimeter_app` (api, engine).
host    perimeter   perimeter,perimeter_app    samenet    scram-sha-256

# No other combination matches, so everything else (other roles, other databases, the superuser
# over TCP) is rejected.
