# Weekly update proposals for everything pinned in this repository: base images (by digest),
# compose images, GitHub Actions (by commit), Python and web dependencies (lockfiles). A release
# is proposed only once it is a week old, so a compromised one is usually pulled before then
# (security updates are not held back).
version: 2
updates:
  - package-ecosystem: docker
    directories: ["/", "/infra/db", "/infra/nats", "/infra/edge"]
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    ignore:
      # The dashboard builds on Node's LTS line, as its CI job does: moving to a new major is a
      # decision, not a routine update.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: "/"
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
  - package-ecosystem: uv
    directory: "/"
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      python: {patterns: ["*"]}
  - package-ecosystem: npm
    directories: ["/web", "/infra/edge/docs"]
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    ignore:
      # The types of the Node release the dashboard builds on (see the docker entry).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      web: {patterns: ["*"]}
